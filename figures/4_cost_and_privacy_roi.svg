   <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="711.36" y="32.556563" transform="rotate(-0 711.36 32.556563)">Enterprise ROI: Measured Runtime, Throughput &amp; Privacy Options</text>
  </g>
  <g id="text_22">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="711.36" y="61.38" transform="rotate(-0 711.36 61.38)">100,000 multi-turn audits/month · 500 held-out traces · all token bills are offline estimates</text>
  </g>
  <g id="text_23">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(15.84 667.92525)">Rule 5: volume + tokens/sec + GPU hours + hourly prices. L40S end-to-end rate: 61.99 out / 1,937 total tok/s; 1,471 audits/hour.</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(15.84 681.362625)">L40S prices use full wall time (1,419.402 s); its generation-only rates use 1,302.923 s. Logical input tokens exclude padding.</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(15.84 694.8)">Local: 20 stratified final-adapter NF4 episodes, batch 1. Historical 3.15 GiB is a separate v1 adapter measurement.</text>
  </g>
  <g id="text_24">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(15.84 757.104812)">GPT-4o same-string o200k counts replace the old Cohere-token $1,316.66 estimate; no actual API invoice or quality parity is asserted.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(15.84 769.422406)">Caching assumes in-TTL eligible hits (≥1,024 prefix tokens, 128-token blocks). Privacy depends on VPC, connectors and logging.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(15.84 781.74)">Electricity uses nameplate power, excludes hardware/CPU/idle/operations; T4 speed is unmeasured. Sources and full arithmetic: ROI_VERIFIED_BENCHMARK.json.</text>
  </g>
 </g>
